name: Build iOS IPA
on:
  workflow_dispatch: # This allows you to run it manually from the website

jobs:
  build:
    runs-on: macos-latest # This gives you a free Mac in the cloud!
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build IPA (No Signature)
        # We build without signing because SideStore/LiveContainer will handle the signing
        run: flutter build ios --release --no-codesign
        
      - name: Compress App to IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/app.ipa
